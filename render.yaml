services:
  - type: web
    name: bhabhi-thulla-api
    env: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @getaway-cards/shared build && pnpm --filter @getaway-cards/server build
    startCommand: pnpm --filter @getaway-cards/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: SQLITE_PATH
        value: /tmp/bhabhi-thulla.sqlite
      - key: SEED_DEMO
        value: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: VOICE_STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: VOICE_TURN_URLS
        sync: false
      - key: VOICE_TURN_REST_SECRET
        sync: false
      - key: VOICE_TURN_CREDENTIAL_TTL_SECONDS
        value: 3600
